<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ferramentas - MundoKaizo{% endblock %}</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'ferramentas/css/base.css' %}">
    
    <style>
        body {
            {% block body_style %}{% endblock %}
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <a href="{% url 'estante' %}">
                <i class="fa-solid fa-rocket"></i> MundoKaizo
            </a>
        </div>
        
        <div class="navbar-menu">
            {% if user.is_authenticated %}
                <button class="user-dropdown-btn" onclick="toggleDropdown()">
                    <i class="fa-solid fa-user-circle" style="font-size: 20px; color: var(--secondary-color);"></i>
                    {{ user.username }}
                    <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i>
                </button>
                <div class="user-dropdown-content" id="userMenu">
                    <a href="{% url 'estante' %}"><i class="fa-solid fa-home"></i> Início</a>
                    <!-- Assuming 'password_reset_guide' or 'alterar_senha' is the correct URL for password reset -->
                    <a href="{% url 'alterar_senha' %}"><i class="fa-solid fa-key"></i> Alterar Senha</a>
                    <a href="{% url 'logout' %}"><i class="fa-solid fa-sign-out-alt"></i> Sair</a>
                </div>
            {% else %}
                <a href="{% url 'login' %}?next={{ request.path }}" class="login-btn"><i class="fa-solid fa-sign-in-alt"></i> Entrar</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'ferramentas/js/base.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
