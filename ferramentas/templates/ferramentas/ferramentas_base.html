{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14213d">
    <title>{% block title %}Ferramentas | MundoKaizo{% endblock %}</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'ferramentas/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
    {% include 'includes/navbar.html' with custom_title="Ferramentas" show_search=False %}

    <main id="conteudo-principal" class="site-main">
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'ferramentas/js/base.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
