{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ferramenta.nome }} | Mundo Kaizo</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #ferramenta-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            text-decoration: none;
            transition: background-color 0.3s;
            font-size: 20px;
        }

        .btn-voltar:hover {
            background-color: rgba(220, 53, 69, 0.9);
        }
        
        /* FontAwesome for the icon */
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css');
    </style>
</head>
<body>

    <a href="{% url 'estante' %}" class="btn-voltar" title="Sair da Ferramenta">
        <i class="fas fa-times"></i>
    </a>

    <!-- O iFrame que carrega o jogo direto da S3 -->
    <iframe 
        id="ferramenta-frame" 
        src="{{ ferramenta.url_ferramenta }}" 
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true" 
        allow="autoplay; fullscreen; geolocation; microphone; camera"
    ></iframe>

</body>
</html>
