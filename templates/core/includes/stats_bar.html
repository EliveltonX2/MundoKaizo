{% load static %}
<link rel="stylesheet" href="{% static 'core/css/dashboard_stats.css' %}?v=20260913c">

<a href="{% url 'dashboard' %}" class="dashboard-stats-link" aria-label="Abrir o painel completo de estatísticas">
    <div class="dashboard-arena-label"><span><i class="fa-solid fa-gamepad" aria-hidden="true"></i> Arena de conquistas</span><small>Seu placar na temporada</small></div>
    <section class="dashboard-stats" aria-label="Resumo das estatísticas">
        <article class="dashboard-stat dashboard-stat-score">
            <span class="dashboard-stat-icon" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
            <div class="dashboard-stat-copy"><span>Pontuação geral</span><strong><span class="counter" data-target="{{ estatisticas.pontuacao_geral|stringformat:'s'|default:'0' }}">0</span></strong></div>
            <i class="fa-solid fa-chart-simple dashboard-stat-watermark" aria-hidden="true"></i>
        </article>
        <article class="dashboard-stat dashboard-stat-streak">
            <span class="dashboard-stat-icon" aria-hidden="true"><i class="fa-solid fa-fire"></i></span>
            <div class="dashboard-stat-copy"><span>Ofensiva</span><strong><span class="counter" data-target="{{ estatisticas.dias_ofensiva|default:0 }}">0</span><small>dias</small></strong></div>
            <i class="fa-solid fa-fire dashboard-stat-watermark" aria-hidden="true"></i>
        </article>
        <article class="dashboard-stat dashboard-stat-record">
            <span class="dashboard-stat-icon" aria-hidden="true"><i class="fa-solid fa-trophy"></i></span>
            <div class="dashboard-stat-copy"><span>Maior ofensiva</span><strong><span class="counter" data-target="{{ estatisticas.maior_ofensiva|default:0 }}">0</span><small>dias</small></strong></div>
            <i class="fa-solid fa-trophy dashboard-stat-watermark" aria-hidden="true"></i>
        </article>
        <article class="dashboard-stat dashboard-stat-ranking">
            <span class="dashboard-stat-icon" aria-hidden="true"><i class="fa-solid fa-medal"></i></span>
            <div class="dashboard-stat-copy"><span>Ranking</span><strong><span class="counter" data-target="{{ ranking|default:0 }}">0</span><small>º</small></strong></div>
            <i class="fa-solid fa-medal dashboard-stat-watermark" aria-hidden="true"></i>
        </article>
    </section>
</a>
<script defer src="{% static 'core/js/dashboard_stats.js' %}?v=20260913a"></script>
