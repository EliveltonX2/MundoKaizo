{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'core/ico/mkz.svg' %}">
    <title>{{ aula.titulo }} - MundoKaizo</title>
    
    <link rel="stylesheet" href="https://bootswatch.com/5/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
    
    <link rel="stylesheet" href="{% static 'core/css/ler_aula.css' %}">
</head>
<body style="background-color: #f4f6f8; min-height: 100vh; display: flex; flex-direction: column;">

    {% url 'livros_interativos' as back_url %}
    {% include 'includes/navbar.html' with back_url=back_url custom_title=aula.titulo show_search=False %}

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        
        <div class="book-container" id="bookWrapper">
            <!-- Usa a property url_interativa que criamos no models.py -->
            <iframe 
                src="{{ aula.url_interativa }}" 
                class="book-iframe" 
                allow="autoplay; fullscreen" 
                id="bookIframe">
            </iframe>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <button onclick="ativarTelaCheia()" class="btn btn-primary" style="border-radius: 20px; padding: 8px 25px;">
                <i class="fas fa-expand"></i> Ler em Tela Cheia
            </button>
        </div>
    </div>

    <script id="aula-config" type="application/json">
    {
        "aula_id": "{{ aula.id }}",
        "csrf_token": "{{ csrf_token }}",
        "url_salvar": "{% url 'api_salvar_progresso_aula' %}",
        "url_carregar": "{% url 'api_carregar_progresso_aula' aula.id %}"
    }
    </script>
    <script src="{% static 'core/js/ler_aula.js' %}"></script>
</body>
</html>
