{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'core/ico/mkz.svg' %}">
    <title>{{ jogo.titulo }} - MundoKaizo</title>
    
    <link rel="stylesheet" href="https://bootswatch.com/5/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
    
    <style>
        .game-container {
            width: 100%;
            max-width: 80vw;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Mantém a proporção 16:9 perfeita (Widescreen) */
            aspect-ratio: 16 / 9; 
            position: relative;
        }
        
        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body style="background-color: #1a1e23; min-height: 100vh; display: flex; flex-direction: column;">

    {% url 'jogos' as arcade_url %}
    {% include 'includes/navbar.html' with back_url=arcade_url custom_title=jogo.titulo show_search=False %}

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        
        <div class="game-container" id="gameWrapper">
            <iframe 
                src="{{ jogo.url_jogar }}" 
                class="game-iframe" 
                allow="autoplay; fullscreen; gamepad" 
                scrolling="no"
                id="gameIframe">
            </iframe>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <button onclick="ativarTelaCheia()" class="btn btn-outline-light" style="border-radius: 20px; padding: 8px 25px;">
                <i class="fas fa-expand"></i> Tela Cheia
            </button>
        </div>
    </div>

    <script>
        function ativarTelaCheia() {
            const wrapper = document.getElementById('gameWrapper');
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) { /* Safari */
                wrapper.webkitRequestFullscreen();
            } else if (wrapper.msRequestFullscreen) { /* IE11 */
                wrapper.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
