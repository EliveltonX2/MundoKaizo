{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'core/ico/mkz.svg' %}">
    <title>{{ livro.titulo }} - MundoKaizo</title>
    
    <link rel="stylesheet" href="https://bootswatch.com/5/morph/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
    
    <style>
        .book-container {
            width: 100%;
            max-width: 90vw;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Proporção para livros pode variar, mas 16:9 é bom para telas web */
            aspect-ratio: 16 / 9; 
            position: relative;
        }
        
        .book-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body style="background-color: #f4f6f8; min-height: 100vh; display: flex; flex-direction: column;">

    {% url 'livros_interativos' as back_url %}
    {% include 'includes/navbar.html' with back_url=back_url custom_title=livro.titulo show_search=False %}

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        
        <div class="book-container" id="bookWrapper">
            <!-- Usa a property url_interativa que criamos no models.py -->
            <iframe 
                src="{{ livro.url_interativa }}" 
                class="book-iframe" 
                allow="autoplay; fullscreen" 
                id="bookIframe">
            </iframe>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <button onclick="ativarTelaCheia()" class="btn btn-primary" style="border-radius: 20px; padding: 8px 25px;">
                <i class="fas fa-expand"></i> Ler em Tela Cheia
            </button>
        </div>
    </div>

    <script>
        function ativarTelaCheia() {
            const wrapper = document.getElementById('bookWrapper');
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            } else if (wrapper.msRequestFullscreen) {
                wrapper.msRequestFullscreen();
            }
        }

        // Listener para a API do livro
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data) return;

            // Tratamento de salvamento de progresso
            if (data.type === 'BOOK_PROGRESS_SAVE') {
                fetch("{% url 'api_salvar_progresso_livro' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        livro_id: '{{ livro.id }}',
                        page: data.page,
                        answers: data.answers,
                        attempts: data.attempts,
                        skills: data.skills,
                        progresso: data.progresso,
                        pontuacao: data.pontuacao,
                        time: data.time
                    })
                })
                .then(res => res.json())
                .then(res => console.log('Progresso salvo:', res))
                .catch(err => console.error('Erro ao salvar:', err));
            }

            // Tratamento de carregamento de progresso
            if (data.type === 'BOOK_PROGRESS_REQUEST') {
                fetch("{% url 'api_carregar_progresso_livro' livro.id %}")
                .then(res => res.json())
                .then(res => {
                    if(res.status === 'sucesso') {
                        // Devolve para o iframe
                        const iframe = document.getElementById('bookIframe');
                        iframe.contentWindow.postMessage({
                            type: 'BOOK_PROGRESS_LOADED',
                            progress: res.progress
                        }, '*');
                    }
                })
                .catch(err => console.error('Erro ao carregar progresso:', err));
            }
        });
    </script>
</body>
</html>
