{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div style="max-width: 800px; margin: 20px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h1 style="color: #2288c4; margin-bottom: 20px;">📚 Upload de Aula Interativa</h1>
    
    <p style="color: #555;">Selecione a pasta completa da Aula Interativa. Os arquivos irão diretamente para o S3 (pasta livros/).</p>

    <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">
    
    <div style="margin-top: 20px;">
        <label style="font-weight: bold; color: #333;">Capítulo Pertencente:</label><br>
        <select id="aulaCapitulo" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <option value="">Selecione um Capítulo...</option>
            {% for cap in capitulos %}
                <option value="{{ cap.id }}">{{ cap.livro.colecao.nome }} - {{ cap.livro.titulo }} - Cap {{ cap.numero }}: {{ cap.titulo }}</option>
            {% endfor %}
        </select>

        <label style="font-weight: bold; color: #333;">Título da Aula:</label><br>
        <input type="text" id="aulaNome" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;" placeholder="Ex: Adição e Subtração">

        <label style="font-weight: bold; color: #333;">Número da Aula:</label><br>
        <input type="number" id="aulaNumero" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;" placeholder="Ex: 1" value="1">

        <label style="font-weight: bold; color: #333;">Seleciona a Pasta (HTML5/Web):</label><br>
        <div style="background: #f9fafb; padding: 15px; border: 1px dashed #b8c1cd; border-radius: 5px; margin-top: 5px; margin-bottom: 20px;">
            <input type="file" id="aulaPasta" webkitdirectory directory multiple>
        </div>

        <button id="btnUpload" style="background: #2288c4; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: background 0.3s;">
            Iniciar Upload para S3
        </button>
    </div>

    <div id="progressoArea" style="margin-top: 30px; display: none; background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e1e8ed;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <b style="color: #2288c4;" id="statusTexto">A preparar ficheiros...</b> 
            <span id="contador" style="font-weight: bold; color: #555;">0/0</span>
        </div>
        <div style="width: 100%; background: #e1e8ed; height: 20px; border-radius: 10px; overflow: hidden;">
            <div id="barraProgresso" style="width: 0%; background: #28a745; height: 100%; transition: width 0.3s ease;"></div>
        </div>
        <p id="ficheiroAtual" style="font-size: 12px; color: #888; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">A aguardar...</p>
    </div>
</div>

<script>
    const csrfToken = '{{ csrf_token }}';

    document.getElementById('btnUpload').addEventListener('click', async function() {
        const capituloInput = document.getElementById('aulaCapitulo');
        const nomeInput = document.getElementById('aulaNome');
        const numeroInput = document.getElementById('aulaNumero');
        const pastaInput = document.getElementById('aulaPasta');
        const btnUpload = document.getElementById('btnUpload');
        
        if (!capituloInput.value) {
            alert("Por favor, selecione um Capítulo.");
            return;
        }
        if (!nomeInput.value.trim()) {
            alert("Por favor, introduz o título da aula.");
            return;
        }
        if (pastaInput.files.length === 0) {
            alert("Por favor, seleciona a pasta da aula.");
            return;
        }

        let temIndex = false;
        for (let i = 0; i < pastaInput.files.length; i++) {
            if (pastaInput.files[i].webkitRelativePath.endsWith("index.html")) {
                temIndex = true;
                break;
            }
        }
        
        if (!temIndex) {
            if(!confirm("Não foi encontrado um ficheiro 'index.html' na pasta selecionada. Tens a certeza que é uma build Web válida?")) {
                return;
            }
        }

        btnUpload.disabled = true;
        btnUpload.style.background = "#99aab5";
        btnUpload.innerText = "A enviar... Por favor, não feches esta janela!";
        
        document.getElementById('progressoArea').style.display = 'block';
        const statusTexto = document.getElementById('statusTexto');
        const contador = document.getElementById('contador');
        const barraProgresso = document.getElementById('barraProgresso');
        const ficheiroAtual = document.getElementById('ficheiroAtual');

        const ficheiros = Array.from(pastaInput.files);
        const totalFicheiros = ficheiros.length;
        
        const tituloSlug = nomeInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        const pastaAulaS3 = `${tituloSlug}_${Date.now()}`;

        let enviados = 0;

        for (const ficheiro of ficheiros) {
            try {
                const partesCaminho = ficheiro.webkitRelativePath.split('/');
                partesCaminho.shift(); 
                const caminhoRelativoLimpo = partesCaminho.join('/');
                
                if (caminhoRelativoLimpo === '') continue;

                ficheiroAtual.innerText = `A enviar: ${caminhoRelativoLimpo}`;

                // Usa a API existente de presigned URL do core
                const respostaDjango = await fetch(`/api/gerar-url-upload/?file_name=${encodeURIComponent(caminhoRelativoLimpo)}&file_type=${encodeURIComponent(ficheiro.type || 'application/octet-stream')}&pasta_jogo=${pastaAulaS3}&pasta_base=livros`);
                
                if (!respostaDjango.ok) throw new Error("Falha ao obter permissão do servidor.");
                const presignedData = await respostaDjango.json();

                const formData = new FormData();
                for (const key in presignedData.fields) {
                    formData.append(key, presignedData.fields[key]);
                }
                formData.append('file', ficheiro);

                const respostaS3 = await fetch(presignedData.url, {
                    method: 'POST',
                    body: formData
                });

                if (!respostaS3.ok) throw new Error(`Falha no upload para o S3: ${respostaS3.statusText}`);

                enviados++;
                const percentagem = Math.round((enviados / totalFicheiros) * 100);
                contador.innerText = `${enviados}/${totalFicheiros}`;
                barraProgresso.style.width = `${percentagem}%`;

            } catch (erro) {
                console.error(erro);
                alert(`Erro ao enviar o ficheiro: ${ficheiro.name}. O upload foi interrompido.`);
                btnUpload.disabled = false;
                btnUpload.style.background = "#2288c4";
                btnUpload.innerText = "Tentar Novamente";
                return; 
            }
        }

        statusTexto.innerText = "A guardar a aula na base de dados...";
        ficheiroAtual.innerText = "A finalizar configurações...";

        try {
            const formDataFinal = new FormData();
            formDataFinal.append('capitulo_id', capituloInput.value);
            formDataFinal.append('titulo', nomeInput.value);
            formDataFinal.append('numero_aula', numeroInput.value);
            formDataFinal.append('pasta_aula', pastaAulaS3);
            
            const respostaFinal = await fetch('/livros-novo/api/salvar-aula/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                },
                body: formDataFinal
            });

            const resultado = await respostaFinal.json();

            if (resultado.status === 'sucesso') {
                statusTexto.innerText = "Upload Concluído com Sucesso!";
                statusTexto.style.color = "#28a745";
                ficheiroAtual.innerText = "A redirecionar...";
                
                setTimeout(() => {
                    window.location.href = `/admin/livros_interativos/aulainterativa/${resultado.aula_id}/change/`;
                }, 1500);
            } else {
                throw new Error("O Django não conseguiu salvar a aula no banco.");
            }
        } catch (erro) {
            console.error(erro);
            alert("Os ficheiros foram enviados para a Amazon, mas ocorreu um erro ao registar a aula no MundoKaizo.");
        }
    });
</script>
{% endblock %}
