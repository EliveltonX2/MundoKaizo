{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="{% static 'core/ico/mkz.svg' %}">
    <title>Lendo: {{ aula.titulo }} - MundoKaizo</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        
        .kz-reader-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .kz-btn-back {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .kz-btn-back:hover {
            background: #fff;
            transform: scale(1.05);
        }

        #aula-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="kz-reader-nav">
        <a href="{% url 'livros_interativos:lista' %}" class="kz-btn-back">
            <i class="fas fa-arrow-left"></i> Voltar à Biblioteca
        </a>
    </div>

    <iframe id="aula-iframe" src="{{ aula.url_interativa }}" allowfullscreen></iframe>

    <!-- Variáveis para a API JS -->
    <script>
        window.KAIZO_AULA_ID = "{{ aula.id }}";
        window.CSRF_TOKEN = "{{ csrf_token }}";
    </script>
    
    <script src="{% static 'livros_interativos/js/api_livros.js' %}"></script>
</body>
</html>
